services:
  # --- Core Infrastructure ---
  postgres:
    image: postgres:16-alpine
    container_name: shop_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: "auth_db,inventory_db,billing_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shop_network

  redis:
    image: redis:7-alpine
    container_name: shop_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shop_network

  # --- API Gateway ---
  api_gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: shop_api_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - AUTH_SERVICE_URL=http://auth_service:8001
      - INVENTORY_SERVICE_URL=http://inventory_service:8002
      - BILLING_SERVICE_URL=http://billing_service:8003
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - shop_network

  # --- Auth & RBAC Microservice ---
  auth_service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: shop_auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/auth_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-insecure-secret-key-replace-in-production-abcdef1234567890
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop_network

  # --- Catalog & Inventory Microservice ---
  inventory_service:
    build:
      context: .
      dockerfile: services/inventory_service/Dockerfile
    container_name: shop_inventory_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/inventory_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-insecure-secret-key-replace-in-production-abcdef1234567890
      - JWT_ALGORITHM=HS256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop_network

  # --- Billing & POS Microservice ---
  billing_service:
    build:
      context: .
      dockerfile: services/billing_service/Dockerfile
    container_name: shop_billing_service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/billing_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-insecure-secret-key-replace-in-production-abcdef1234567890
      - JWT_ALGORITHM=HS256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop_network

volumes:
  postgres_data:
  redis_data:

networks:
  shop_network:
    driver: bridge
